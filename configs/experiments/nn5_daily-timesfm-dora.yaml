# TimesFM 2.5 + DoRA on NN5 Daily.
#
# Derived from nn5_daily-timesfm-lora.yaml and differing in exactly one field: method. See
# etth1-timesfm-dora.yaml for what that changes and why nothing else moves with it.
name: nn5_daily-timesfm-dora
data: ../data/nn5_daily.yaml
model:
  name: timesfm_2p5
  options:
    checkpoint: google/timesfm-2.5-200m-transformers
    revision: null
    device: auto
    dtype: float32
    batch_size: 32
    clamp_negative: per_series
    peft:
      method: dora
      rank: 16
      alpha: 32
      dropout: 0.0
      target_modules: [q_proj, k_proj, v_proj, o_proj, fc1, fc2]
training:
  max_steps: 600
  batch_size: 8
  learning_rate: 0.0001
  warmup_steps: 30
  schedule: cosine
  grad_clip: 1.0
  eval_every: 60
  patience: 3
  selection_metric: mase
  save_adapter: true
seed: 0
notes: >-
  DoRA arm. Identical to the LoRA config of the same dataset apart from the method, down to
  the step budget: DoRA costs more per step, and that difference belongs in the wall-clock
  column rather than being compensated for by training it for fewer steps.
