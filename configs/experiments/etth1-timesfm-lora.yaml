# TimesFM 2.5 + LoRA on ETTh1.
#
# Shares ../data/etth1.yaml with the zero-shot arm, so the two rows cannot disagree about
# the horizon, the context or which observations are reserved for evaluation.
#
# The fit region is 16460 steps per channel; at context 512, horizon 96 and the default
# stride of one horizon that is 166 training windows per channel, 1162 in total, so 1000
# steps at batch 8 is roughly seven passes over the data.
#
# The hyperparameters below are documented starting points, not tuned values -- nothing has
# been swept. Tune them against the validation windows (never the test ones) before
# publishing, and record what was swept in the README's limitations section.
name: etth1-timesfm-lora
data: ../data/etth1.yaml
model:
  name: timesfm_2p5
  options:
    checkpoint: google/timesfm-2.5-200m-transformers
    revision: null
    device: auto
    dtype: float32
    batch_size: 32
    clamp_negative: per_series
    peft:
      method: lora
      rank: 16
      alpha: 32
      dropout: 0.0
      # Attention and MLP projections of all 20 decoder layers. The input embedding and the
      # output projection heads stay frozen, so the pretrained horizon-to-quantile mapping
      # is preserved and the trainable count stays honest.
      target_modules: [q_proj, k_proj, v_proj, o_proj, fc1, fc2]
training:
  max_steps: 1000
  batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  weight_decay: 0.0
  warmup_steps: 50
  schedule: cosine
  grad_clip: 1.0
  eval_every: 100
  patience: 3
  selection_metric: mase
  save_adapter: true
seed: 0
notes: >-
  LoRA arm. Compare against etth1-timesfm-zeroshot, which shares the data config. Trainable
  parameters, peak memory and wall clock are in the artifact alongside the accuracy metrics.
