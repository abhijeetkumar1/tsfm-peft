# TimesFM 2.5 + DoRA on ETTh1 at rank 64, alpha 128.
#
# Derived from etth1-timesfm-lora-r64.yaml and differing in exactly one field:
# method. DoRA decomposes each adapted weight into a magnitude and a direction and
# trains both, so at the same rank it trains slightly more parameters -- one scalar per
# adapted output channel -- and costs more per step. Both differences are in the
# artifact.
#
# The DoRA rows exist at rank 16 (etth1-timesfm-dora.yaml), 64 and 128, so the method
# comparison is available at three points rather than one. There is deliberately no DoRA
# row at 4, 8 or 32: the question those ranks answer is about the rank curve, and one
# method is enough to answer it.
#
# alpha moves with rank to hold alpha/rank at 2.0, as everywhere else in the sweep.
name: etth1-timesfm-dora-r64
data: ../data/etth1.yaml
model:
  name: timesfm_2p5
  options:
    checkpoint: google/timesfm-2.5-200m-transformers
    revision: null
    device: auto
    dtype: float32
    batch_size: 32
    clamp_negative: per_series
    peft:
      method: dora
      rank: 64
      alpha: 128
      dropout: 0.0
      # Attention and MLP projections of all 20 decoder layers. The input embedding and the
      # output projection heads stay frozen, so the pretrained horizon-to-quantile mapping
      # is preserved and the trainable count stays honest.
      target_modules: [q_proj, k_proj, v_proj, o_proj, fc1, fc2]
training:
  max_steps: 1000
  batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  weight_decay: 0.0
  warmup_steps: 50
  schedule: cosine
  grad_clip: 1.0
  eval_every: 100
  patience: 3
  selection_metric: mase
  save_adapter: true
seed: 0
notes: >-
  DoRA arm at rank 64. Identical to etth1-timesfm-lora-r64.yaml apart from the
  method, so the pair isolates what DoRA's magnitude decomposition buys at this rank.
