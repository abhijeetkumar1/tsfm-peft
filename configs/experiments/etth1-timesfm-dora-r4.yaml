# TimesFM 2.5 + DoRA on ETTh1 at rank 4, alpha 8.
#
# Derived from etth1-timesfm-lora-r4.yaml and differing in exactly one field:
# method. DoRA decomposes each adapted weight into a magnitude and a direction and
# trains both, so at the same rank it trains slightly more parameters -- one scalar per
# adapted output channel -- and costs more per step. Both differences are in the
# artifact.
#
# Every LoRA rank has a DoRA row at the same rank, so the two sweeps can be read against
# each other point by point rather than at a single crossing. alpha moves with rank to
# hold alpha/rank at 2.0, as everywhere else.
name: etth1-timesfm-dora-r4
data: ../data/etth1.yaml
model:
  name: timesfm_2p5
  options:
    checkpoint: google/timesfm-2.5-200m-transformers
    revision: null
    device: auto
    dtype: float32
    batch_size: 32
    clamp_negative: per_series
    peft:
      method: dora
      rank: 4
      alpha: 8
      dropout: 0.0
      # Attention and MLP projections of all 20 decoder layers. The input embedding and the
      # output projection heads stay frozen, so the pretrained horizon-to-quantile mapping
      # is preserved and the trainable count stays honest.
      target_modules: [q_proj, k_proj, v_proj, o_proj, fc1, fc2]
training:
  max_steps: 1000
  batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  weight_decay: 0.0
  warmup_steps: 50
  schedule: cosine
  grad_clip: 1.0
  eval_every: 100
  patience: 3
  selection_metric: mase
  save_adapter: true
seed: 0
notes: >-
  DoRA arm at rank 4. Identical to etth1-timesfm-lora-r4.yaml apart from the
  method, so the pair isolates what DoRA's magnitude decomposition buys at this rank.
