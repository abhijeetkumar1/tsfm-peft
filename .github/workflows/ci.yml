name: CI

on:
  push:
    # `dev` is where work lands before a PR exists, and a branch nothing checks is a branch
    # that can sit broken: a bad merge resolution into `dev` once reached a PR as the first
    # thing that noticed. A commit with an open PR runs twice, which is the cheaper mistake.
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic hashing so any accidental set-iteration ordering is reproducible.
  PYTHONHASHSEED: "0"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Use the project's own pinned ruff (from uv.lock) so CI and local runs
      # can never disagree about which lint rules are in force.
      - name: Install
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      # The README table is generated from the metrics artifacts, never hand-edited. This
      # is what enforces that: a number typed into the README by hand, or one left stale
      # after a re-run, fails the build. It needs no artifacts to be present -- with an
      # empty results directory the expected table is the all-pending one.
      - name: Results table is current
        run: uv run tsfm-peft table --configs configs/experiments --check

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # Core + dev only: the `models` extra (torch, transformers, peft) is
      # deliberately not installed here, so this job stays fast. Tests that need
      # model weights are marked and skipped.
      - name: Install
        run: uv sync --extra dev
      - name: Test
        run: uv run pytest -m "not slow and not gpu and not network" --cov=tsfm_peft --cov-report=term-missing

  models:
    name: pytest (models extra, CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      # The job the torch-free matrix cannot do: prove the fine-tuning path actually
      # runs. The tiny fixture model is randomly initialised, so nothing is downloaded
      # and nothing here is a benchmark -- it exercises the real architecture, the real
      # peft wiring and the real optimiser end to end on CPU.
      #
      # Installed from the lockfile like every other job, which on Linux means the
      # CUDA-flavoured torch wheel even though this runner has no GPU. Pinning a CPU
      # index here would mean CI resolving different wheels than a contributor does,
      # which is the more expensive kind of difference; the uv cache absorbs the size.
      - name: Install
        run: uv sync --extra dev --extra models
      - name: Test
        run: uv run pytest -m "not slow and not gpu and not network"
      - name: Fine-tune end to end
        run: uv run tsfm-peft run configs/experiments/synthetic-timesfm-tiny-lora.yaml

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
